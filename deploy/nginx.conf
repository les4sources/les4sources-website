# Sert le site statique Astro (dist/) et rejoue les redirections SEO.
server {
    listen 80 default_server;
    server_name www.les4sources.be;

    root /usr/share/nginx/html;
    index index.html;

    # L'origine est derrière un reverse proxy qui termine le TLS : on émet des
    # redirections RELATIVES pour préserver le scheme (https) et l'hôte réels.
    # http → https est donc géré EN AMONT par ce proxy, pas ici.
    absolute_redirect off;

    # Canonique = www. L'apex les4sources.be (et tout autre hôte) part en 301 vers www.
    if ($host != "www.les4sources.be") { return 301 https://www.les4sources.be$request_uri; }

    # Normalisation du slash final : /foo/ → /foo (Astro est en trailingSlash "never").
    # `merge_slashes` est actif par défaut, donc //foo est déjà réduit à /foo.
    rewrite ^/(.*)/$ /$1 permanent;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    # Redirections 301 des anciennes URLs, générées depuis public/_redirects.
    include /etc/nginx/redirects.conf;

    # Assets hashés par Astro : cache long immuable. `^~` = pas d'évaluation regex ici.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Polices auto-hébergées : même durée de vie que les assets hashés.
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images OG et favicons : cache moyen, ils peuvent changer sans changer de nom.
    location ^~ /og/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Astro (trailingSlash: never) : sert /x via /x.html puis /x/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
