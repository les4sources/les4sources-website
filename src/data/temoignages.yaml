# Témoignages publiés dans la newsletter des 4 Sources (Listmonk, liste 1).
# Texte et signature recopiés À L'IDENTIQUE de la campagne d'origine : on ne
# reformule pas, on ne complète pas un prénom. `campaign` est l'id Listmonk de
# la première newsletter qui l'a publié, pour retrouver la source.
#
# `pages` = les legacyPath où le témoignage s'affiche ; `home` = il fait partie
# de la sélection de la page d'accueil.

- id: olivier-focus-jardin-foret
  quote: "La semaine avec Semisto aux 4 Sources est riche en informations, partage de savoirs et d’expériences. Le travail que j’ai réalisé sur mon projet, accompagné des formateurs, m’a permis de revenir avec un plan relativement défini que j’ai de suite partagé avec ma famille. Convaincus, nous avons démarré la transformation avant l’hiver."
  author: "Olivier"
  newsletter: { campaign: 3, month: "2026-02" }
  pages:
    - /projets/semisto

